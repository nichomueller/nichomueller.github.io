name: Build and Deploy
on:
  push:
    branches:
      - main
      - master
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Package static site
      run: |
        mkdir -p __site
        cp index.html __site/
        cp 404.html __site/
        cp site.css __site/
        cp -r assets __site/assets
        cp -r contact __site/contact
        cp -r menu1 __site/menu1
        cp -r menu2 __site/menu2
        cp -r menu3 __site/menu3
        cp -r menu4 __site/menu4
        cp -r notes __site/notes
    - name: Build and Deploy
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: __site
